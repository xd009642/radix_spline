name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

jobs:
  build_and_test:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt clippy
      - name: Rustfmt
        run: cargo fmt --check
      - name: Cargo test
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy
