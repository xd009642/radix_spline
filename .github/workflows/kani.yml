name: Kani

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          args: "--tests"
