name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

jobs:
  build_and_test:
    name: Rust project (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: no features
            cargo_args: --no-default-features
          - features: all features
            cargo_args: --all-features
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt clippy
      - name: Rustfmt
        run: cargo fmt --check
      - name: Cargo test
        run: cargo test ${{ matrix.cargo_args }}
      - name: Clippy
        run: cargo clippy ${{ matrix.cargo_args }} --all-targets -- -D warnings
